<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nối từ</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#d9dce5; --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --card:#1e212b; --text:#e8eaf0; --muted:#9aa1b0; --line:#343846; --accent:#818cf8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  header h1 { font-size:1.4rem; margin:0 auto 0 0; }
  select, input[type=file], button { font:inherit; color:inherit; }
  select { padding:6px 8px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .muted { color:var(--muted); margin:4px 0 12px; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); transition:width .25s; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cols > div { display:flex; flex-direction:column; gap:8px; }
  .cell { text-align:left; padding:12px 14px; background:var(--card); border:2px solid var(--line); border-radius:10px; cursor:pointer; }
  .cell:hover { border-color:var(--accent); }
  .cell.sel { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .btn { padding:10px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .btn.alt { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .actions { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
  .row { padding:10px 14px; border-radius:10px; margin:8px 0; border-left:6px solid; background:var(--card); }
  .row.ok { border-color:var(--ok); } .row.no { border-color:var(--bad); }
  .err { color:var(--bad); }
  @media (max-width:560px) { .cols { gap:8px; } .cell { padding:10px; font-size:.95rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧩 Nối từ</h1>
    <select id="files" aria-label="File mẫu"></select>
    <input id="upload" type="file" accept=".json" aria-label="Tải JSON lên">
  </header>
  <div id="app"></div>
</main>
<script>
const COLORS = ['#3b82f6','#f97316','#22c55e','#a855f7','#eab308','#ef4444','#92400e','#64748b','#0ea5e9','#ec4899'];
const $ = s => document.querySelector(s);
let source = {}, game = null, pairs = {}, sel = null;   // pairs: {term_id: definition_idx}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;       // textContent: an toàn, không chèn HTML
  return e;
}
async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Lỗi không xác định');
  return j;
}
function showError(e) { const p = el('p','err', e.message); $('#app').replaceChildren(p); }

async function start(onlyIds) {
  try {
    const body = source.data ? { data: source.data } : { file: source.file };
    if (onlyIds) body.only_ids = onlyIds;
    game = await api('/api/matching/new', body);
    pairs = {}; sel = null; render();
  } catch (e) { showError(e); }
}

const ownerOf = (side, key) => side === 't' ? (key in pairs ? key : null)
                              : (Object.keys(pairs).find(k => pairs[k] === key) ?? null);

function click(side, key) {
  if (ownerOf(side, key) !== null) { delete pairs[ownerOf(side, key)]; sel = null; return render(); }  // gỡ cặp
  if (sel && sel.side === side && sel.key === key) { sel = null; return render(); }                    // bỏ chọn
  if (sel && sel.side !== side) {                                                                       // tạo cặp
    pairs[side === 't' ? key : sel.key] = side === 'd' ? key : sel.key;
    sel = null; return render();
  }
  sel = { side, key }; render();
}

function cell(side, key, text) {
  const b = el('button', 'cell', text); b.type = 'button';
  const owner = ownerOf(side, key);
  if (owner !== null) {
    const i = game.terms.findIndex(t => t.id === owner);
    b.style.boxShadow = `inset 8px 0 0 ${COLORS[i % COLORS.length]}`; b.style.paddingLeft = '22px';
  }
  if (sel && sel.side === side && sel.key === key) b.classList.add('sel');
  b.onclick = () => click(side, key);
  return b;
}

function render() {
  const app = $('#app'), n = game.terms.length, done = Object.keys(pairs).length;
  const bar = el('div','bar'), fill = el('div','fill'); fill.style.width = (done / n * 100) + '%'; bar.append(fill);
  const L = el('div'), R = el('div');
  game.terms.forEach(t => L.append(cell('t', t.id, t.term)));
  game.definitions.forEach(d => R.append(cell('d', d.idx, d.text)));
  const cols = el('div','cols'); cols.append(L, R);
  const check = el('button','btn','Kiểm tra đáp án'); check.disabled = done < n;
  check.onclick = async () => { try { showResult(await api('/api/matching/check', { game_id: game.game_id, pairs })); } catch (e) { showError(e); } };
  const hint = sel ? 'Đang chọn 1 ô - hãy bấm ô tương ứng ở cột bên kia.' : 'Bấm một thuật ngữ rồi bấm định nghĩa tương ứng. Bấm lại ô đã ghép để gỡ cặp.';
  const actions = el('div','actions'); actions.append(check);
  app.replaceChildren(el('h2','', game.title || ''), bar, el('p','muted', `Đã ghép ${done}/${n} cặp · ${hint}`), cols, actions);
}

function showResult(res) {
  const app = $('#app');
  const head = el('h2','', `Điểm: ${res.score}/${res.total}${res.wrong.length ? '' : ' 🎉'}`);
  const rows = res.review.map(r => {
    const d = el('div', 'row ' + (r.ok ? 'ok' : 'no'));
    const b = el('strong','', r.term);
    d.append(b, document.createTextNode(r.ok ? ` → ${r.correct}` : ` → bạn chọn: ${r.chosen} · đúng: ${r.correct}`));
    return d;
  });
  const again = el('button','btn alt','🔄 Chơi lại'); again.onclick = () => start();
  const actions = el('div','actions'); actions.append(again);
  if (res.wrong.length) { const r = el('button','btn','📝 Ôn lại câu sai'); r.onclick = () => start(res.wrong); actions.append(r); }
  app.replaceChildren(head, ...rows, actions);
}

$('#files').onchange = e => { source = { file: e.target.value }; $('#upload').value = ''; start(); };
$('#upload').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { source = { data: JSON.parse(await f.text()) }; start(); } catch (err) { showError(new Error('File JSON không hợp lệ.')); }
};
(async () => {
  try {
    const { files } = await api('/api/matching/files');
    $('#files').replaceChildren(...files.map(f => { const o = el('option','',f); o.value = f; return o; }));
    if (files.length) { source = { file: files[0] }; start(); }
  } catch (e) { showError(e); }
})();
</script>
</body>
</html>
