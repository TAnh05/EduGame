<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edu Game – Ôn tập bằng game</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --text: #1f2430; --muted: #6b7280;
    --line: #d9dce5; --accent: #4f46e5; --accent2: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --card: #1e212b; --text: #e8eaf0; --muted: #9aa1b0;
      --line: #343846; --accent: #818cf8; --accent2: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 520px; width: 100%; padding: 24px 16px; text-align: center; }
  h1 { font-size: 1.75rem; margin: 0 0 6px; }
  p.muted { color: var(--muted); margin: 0 0 28px; }
  .cards { display: grid; gap: 14px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 18px; text-align: left; transition: border-color .15s, box-shadow .15s;
  }
  a.card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  a.card h2 { margin: 0 0 4px; font-size: 1.2rem; }
  a.card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .emoji { font-size: 1.6rem; margin-right: 8px; }
</style>
</head>
<body>
<main>
  <h1>🎮 Edu Game</h1>
  <p class="muted">Chọn game để bắt đầu ôn tập</p>
  <div class="cards">
    <a class="card" href="/matching.html">
      <h2><span class="emoji">🧩</span>Nối từ</h2>
      <p>Ghép thuật ngữ với định nghĩa tương ứng</p>
    </a>
    <a class="card" href="/fill_blank.html">
      <h2><span class="emoji">✏️</span>Điền vào chỗ trống</h2>
      <p>Chọn đáp án đúng để hoàn thành câu</p>
    </a>
  </div>
</main>
</body>
</html>
