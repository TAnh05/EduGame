name: OCR CI

on:
  push:
    branches: [main, toanbranch]
  pull_request:
    branches: [main, toanbranch]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Core environment smoke test (no model or torch)
        run: python test_stage0_env.py --core
      - name: Compile source
        run: python -m compileall -q app.py ocr_module tests
      - name: Run regression and contract tests
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: |
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
